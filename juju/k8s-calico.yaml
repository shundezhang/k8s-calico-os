machines:
  "0": {}
  "1": {}
  "2": {}
applications:
  calico:
    charm: calico
    channel: 1.28/stable
    options:
      cidr: 192.168.128.0/18
      global-as-number: 64552
      global-bgp-peers: '[{address: 192.168.0.193, as-number: 64512}]'
      ipip: Never
      nat-outgoing: false
      node-to-node-mesh: true
  containerd:
    charm: containerd
    channel: 1.28/stable
  easyrsa:
    charm: easyrsa
    channel: 1.28/stable
    num_units: 1
    to:
    - "0"
  etcd:
    charm: etcd
    channel: 1.28/stable
    num_units: 1
    options:
      channel: 3.4/stable
    to:
    - "0"
  kubernetes-control-plane:
    charm: kubernetes-control-plane
    channel: 1.28/stable
    num_units: 1
    to:
    - "0"
    options:
      allow-privileged: "true"
      api-extra-args: ""
      audit-policy: |
        apiVersion: audit.k8s.io/v1beta1
        kind: Policy
        rules:
        # Don't log read-only requests from the apiserver
        - level: None
          users: ["system:apiserver"]
          verbs: ["get", "list", "watch"]
        # Don't log kube-proxy watches
        - level: None
          users: ["system:kube-proxy"]
          verbs: ["watch"]
          resources:
          - resources: ["endpoints", "services"]
        # Don't log nodes getting their own status
        - level: None
          userGroups: ["system:nodes"]
          verbs: ["get"]
          resources:
          - resources: ["nodes"]
        # Don't log kube-controller-manager and kube-scheduler getting endpoints
        - level: None
          users: ["system:unsecured"]
          namespaces: ["kube-system"]
          verbs: ["get"]
          resources:
          - resources: ["endpoints"]
        # Log everything else at the Request level.
        - level: Request
          omitStages:
          - RequestReceived
      audit-webhook-config: ""
      authorization-mode: RBAC,Node
      #extra_sans: <k8s-api-domain> # FIXME
      service-cidr: 192.168.192.0/18
  kubernetes-worker:
    charm: kubernetes-worker
    channel: 1.28/stable
    num_units: 2
    to:
    - "1"
    - "2"
    expose: true
    options:
      kubelet-extra-config: '{}'
relations:
- - etcd:certificates
  - easyrsa:client
- - kubernetes-control-plane:kube-control
  - kubernetes-worker:kube-control
- - kubernetes-control-plane:etcd
  - etcd:db
- - containerd:containerd
  - kubernetes-control-plane:container-runtime
- - containerd:containerd
  - kubernetes-worker:container-runtime
- - kubernetes-control-plane:certificates
  - easyrsa:client
- - kubernetes-worker:certificates
  - easyrsa:client
- - calico:etcd
  - etcd:db
- - calico:cni
  - kubernetes-control-plane:cni
- - calico:cni
  - kubernetes-worker:cni
- - kubernetes-control-plane:kube-api-endpoint
  - kubernetes-worker:kube-api-endpoint

